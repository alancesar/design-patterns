"Strategic Focus":
  label: "Strategic Focus"
  permalink: "/strategic-focus"
  description: "Concentrating modeling effort and investment on what sets the business apart: its strategic core."

"Team Autonomy":
  label: "Team Autonomy"
  permalink: "/team-autonomy"
